<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Nine: game sim</title>
<style>
  :root {
    --pink: #ff2e93; --purple: #7b5cff; --ink: #2b2233; --lilac: #cdb4ff; --pale: #ffd6ea; --white: #fff8fc;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fdeef7; color: var(--ink); font: 600 16px/1.3 var(--font); }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: linear-gradient(90deg, #ffe1f1, #e9e1ff); border-bottom: 2px solid #f6c6e1; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; letter-spacing: .3px; }
  header h1 span { color: var(--pink); }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px; background: rgba(255, 255, 255, .7); border-radius: 14px; }
  .group label { padding: 0 6px; font-size: 14px; opacity: .75; }
  button { font: inherit; font-size: 16px; min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 #f0c3dd; }
  button:hover { background: var(--pale); }
  button.on { background: var(--pink); color: #fff; box-shadow: 0 2px 0 #b8146a; }
  #count { min-width: 28px; text-align: center; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  aside { width: 330px; overflow: auto; padding: 10px 12px; background: rgba(255, 255, 255, .72); border-left: 2px solid #f6c6e1; }
  aside h2 { font-size: 15px; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .8px; opacity: .6; }
  .phase { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; }
  .phase b { font-size: 30px; color: var(--pink); font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 15px; margin: 4px 0; }
  .line { background: #fff; border-radius: 12px; padding: 8px 10px; margin-top: 6px; }
  .action { margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 4px; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  tr.me td { color: var(--pink); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #log { list-style: none; padding: 0; margin: 0; font-size: 15px; }
  #log li { padding: 4px 0; border-bottom: 1px dashed #f3cde2; }
  #log li small { opacity: .55; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 14px; opacity: .65; margin-top: 10px; }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    #stage { min-height: 56vh; }
    aside { width: auto; border-left: 0; border-top: 2px solid #f6c6e1; }
  }
</style>
</head>
<body>
<header>
  <h1>Cloud Nine <span>game sim</span></h1>
  <div class="group" id="modes"></div>
  <div class="group"><label>Players</label><button id="minus" aria-label="Fewer players">-</button><span id="count">6</span><button id="plus" aria-label="More players">+</button></div>
  <div class="group" id="levels"></div>
  <div class="group" id="speeds"></div>
  <div class="group"><button id="restart">New game</button><button id="me" title="Play as the first player: arrows or WASD to move, Space for the action button">Play as P1</button></div>
</header>
<main>
  <div id="stage"><canvas id="c"></canvas></div>
  <aside>
    <div class="phase"><span id="phase">lobby</span><b id="timer"></b></div>
    <div id="badge"></div>
    <div class="line" id="line"></div>
    <div class="action" id="action"></div>
    <h2 id="sbtitle">Score</h2>
    <table id="score"></table>
    <h2>What happened</h2>
    <ul id="log"></ul>
    <p class="hint">Click a player to see the game through their eyes. Pink and purple are the teams; a gold ring is the seeker, coral is "it", ice blue is frozen.</p>
  </aside>
</main>
<script type="module" src="./games-sim.js"></script>
</body>
</html>
