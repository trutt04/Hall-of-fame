<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Nine: net lab</title>
<style>
  :root {
    --pink: #ff2e93; --pink-soft: #ff8cc6; --pale: #ffd6ea; --ink: #2b2233; --white: #fff8fc;
    --lilac: #cdb4ff; --sky: #9fc4ff; --mint: #9be7c4; --gold: #ffd36e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: linear-gradient(#9fc4ff, #ffd1e8); color: var(--ink); overflow: hidden; }
  body { font: 600 16px/1.3 var(--font, system-ui, sans-serif); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255, 248, 252, .82); }
  h1 { font-size: 18px; margin: 0 6px 0 0; color: var(--pink); }
  .pill { padding: 4px 10px; border-radius: 999px; background: var(--lilac); white-space: nowrap; }
  .pill.online { background: var(--mint); }
  .pill.connecting { background: var(--gold); }
  #code { font-size: 26px; letter-spacing: 6px; color: var(--pink); min-width: 4.5em; }
  button, input { font: inherit; min-height: 48px; border-radius: 14px; border: 0; padding: 0 14px; }
  button { background: var(--pink); color: white; cursor: pointer; }
  button.soft { background: var(--pink-soft); }
  button.emote { background: white; color: var(--pink); border: 2px solid var(--pink-soft); }
  button:disabled { opacity: .45; cursor: default; }
  input { width: 6.5em; text-transform: uppercase; letter-spacing: 4px; background: white; color: var(--ink); border: 2px solid var(--pink-soft); }
  #main { flex: 1; min-height: 0; display: flex; }
  #stage { position: relative; flex: 1; min-width: 0; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #side { width: 340px; display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; }
  #info, #log { background: rgba(255, 248, 252, .86); border-radius: 12px; padding: 6px 10px; font-size: 16px; }
  #log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
  #game { white-space: pre-wrap; word-break: break-all; font-size: 16px; max-height: 9em; overflow: hidden; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #side { width: auto; height: 32%; flex-direction: row; }
    #info { width: 40%; overflow: hidden; }
    #log div { white-space: normal; }
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Net lab</h1>
  <span id="status" class="pill">offline</span>
  <span id="code" aria-label="room code"></span>
  <span id="host" class="pill" hidden>You're the host</span>
  <div class="row">
    <button id="create">Create room</button>
    <input id="joinCode" maxlength="6" placeholder="CODE" autocomplete="off" aria-label="room code to join">
    <button id="join" class="soft">Join</button>
    <button id="leave" class="soft">Leave</button>
    <button id="bot" class="soft">Add bot</button>
    <button id="game-btn" class="soft">Start game</button>
  </div>
  <div class="row" id="emotes"></div>
</header>
<div id="main">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="side">
    <div id="info"><div id="who"></div><div id="game"></div></div>
    <div id="log" aria-live="polite"></div>
  </div>
</div>
<script type="module" src="./net-lab.js"></script>
</body>
</html>
