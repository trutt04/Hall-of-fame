<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hit Zero: art gallery</title>
<style>
  html, body { margin: 0; background: linear-gradient(#9fc4ff, #ffd1e8); color: #2b2233; min-height: 100%;
    font: 700 16px/1.3 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
  h1 { margin: 12px 16px 4px; font-size: 22px; }
  p { margin: 0 16px 8px; font-weight: 600; }
  canvas { display: block; margin: 0 auto; }
  nav { margin: 0 16px 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav a { color: #fff; background: #ff2e93; padding: 6px 12px; border-radius: 999px; text-decoration: none; }
</style>
</head>
<body>
<h1>Hit Zero: art gallery</h1>
<p>Every pose (full size with poms), every lane icon, and the judges' panel.</p>
<nav><a href="?">Poses and icons</a><a href="?judges=1">Judges</a><a href="?judges=1&zero=1">Judges: HIT ZERO</a><a href="./rhythm-play.html">Play</a></nav>
<canvas id="c"></canvas>
<script type="module">
  import { POSES, poseSkeleton, drawFigure, drawMotionIcon, drawBow } from '../js/rhythm/figure.js';
  import { MOTION_LABELS } from '../js/rhythm/charts.js';

  const q = new URLSearchParams(location.search);
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.min(window.innerWidth, 1100);

  async function judges() {
    const { createJudgesPanel } = await import('../js/rhythm/judges.js');
    const H = 420;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    const panel = createJudgesPanel();
    const zero = q.has('zero');
    panel.setCards(zero ? [10, 10, 10] : [9.5, 8, 7.5]);
    const t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      panel.reveal(Math.min(3, Math.floor(t / 0.6)));
      panel.draw(g, 0, 0, W, H, t, { cheering: zero });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function poses() {
    const names = Object.keys(POSES);
    const cell = 130;
    const cols = Math.max(2, Math.floor(W / cell));
    const rows = Math.ceil(names.length / cols);
    const iconRows = Math.ceil(names.length / Math.max(2, Math.floor(W / 74)));
    const H = rows * (cell + 26) + 40 + iconRows * 80 + 120;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    const colors = ['#ff2e93', '#a96bff', '#3fa9f5'];
    function frame(now) {
      const t = now / 1000;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      g.font = '700 13px ui-rounded, system-ui, sans-serif';
      g.textAlign = 'center';
      names.forEach((name, i) => {
        const x = (i % cols) * cell + cell / 2;
        const y = Math.floor(i / cols) * (cell + 26) + cell - 6;
        g.fillStyle = 'rgba(255,255,255,0.35)';
        g.fillRect(x - cell / 2 + 4, y - cell + 10, cell - 8, cell + 8);
        drawFigure(g, x, y - 4, 96, poseSkeleton(name), { poms: true, t });
        g.fillStyle = '#2b2233';
        g.fillText(MOTION_LABELS[name] || name, x, y + 14);
      });
      let y0 = rows * (cell + 26) + 30;
      const icols = Math.max(2, Math.floor(W / 74));
      names.forEach((name, i) => {
        const x = (i % icols) * 74 + 37;
        const y = y0 + Math.floor(i / icols) * 80 + 34;
        drawMotionIcon(g, x, y, 30, name, { color: colors[i % 3], t });
      });
      y0 += iconRows * 80 + 10;
      drawBow(g, 80, y0 + 40, 120);
      drawBow(g, 200, y0 + 40, 40);
      drawBow(g, 260, y0 + 40, 18);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function big() {
    const names = (q.get('big') || 'highV,scorpion,liberty').split(',');
    const H = 380;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    function frame(now) {
      const t = now / 1000;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      names.forEach((name, i) => {
        const x = (i + 0.5) * (W / names.length);
        drawFigure(g, x, H - 40, 300, poseSkeleton(name), { poms: true, t });
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (q.has('judges')) judges(); else if (q.has('big')) big(); else poses();
</script>
</body>
</html>
