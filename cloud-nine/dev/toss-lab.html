<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cloud Nine: basket toss lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4ff; overscroll-behavior: none; }
  body { font: 700 16px/1.25 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2b2233; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* the stand-in HUD: just what Contract 1 asks of it */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  .lab-prompt { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); min-height: 60px; padding: 0 24px;
    border: 3px solid #17121c; border-radius: 20px; background: #ff2e93; color: #fff; font: inherit; font-size: 21px; font-weight: 900; pointer-events: auto;
    box-shadow: 0 5px 0 #17121c; touch-action: manipulation; cursor: pointer; }
  .lab-prompt:active { transform: translateY(2px); box-shadow: 0 3px 0 #17121c; }
  .lab-toasts { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: calc(100vw - 24px); }
  .lab-toast { padding: 10px 16px; border-radius: 16px; background: #fff8fc; border: 2px solid #17121c; box-shadow: 0 3px 0 #17121c; font-size: 17px; animation: lab-in .25s ease-out both; }
  @keyframes lab-in { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .lab-stick { position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: rgba(255,248,252,.28); border: 3px solid rgba(255,255,255,.75); display: none; }
  .lab-stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: #ff8cc6; border: 3px solid #fff; }
  .lab-fade { position: absolute; inset: 0; background: #fff8fc; opacity: 0; transition: opacity .17s; }
  /* the lab's own controls */
  #panel { position: fixed; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); z-index: 40; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 16px)); }
  #panel button { min-height: 40px; padding: 0 12px; border-radius: 12px; border: 2px solid #17121c; background: #fff8fc; font: inherit; font-size: 15px; cursor: pointer; }
  #panel button.on { background: #ffd36e; }
  #panel .lab-stats { padding: 4px 8px; border-radius: 10px; background: rgba(23,18,28,.6); color: #fff; font-size: 13px; font-weight: 600; white-space: pre; align-self: center; }
  #panel.hidden { display: none; }
  .lab-label { position: fixed; transform: translate(-50%, 0); padding: 2px 8px; border-radius: 8px; background: rgba(23,18,28,.72); color: #fff; font-size: 13px; pointer-events: none; white-space: nowrap; z-index: 10; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"></div>
<div id="panel"></div>
<script type="module" src="./toss-lab.js"></script>
</body>
</html>
