<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Nine dev: stand-in cheerleader</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffd1e8;font:700 14px/1.3 ui-rounded,system-ui,sans-serif;color:#2b2233}
  canvas{display:block;width:100%;height:100%}
  #bar{position:fixed;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #bar button{min-height:34px;padding:4px 12px;border:2.5px solid #17121c;border-radius:999px;background:#fff8fc;font:inherit;cursor:pointer}
  #bar button.on{background:#ff2e93;color:#fff}
  #note{position:fixed;left:8px;bottom:8px;padding:6px 10px;background:rgba(255,248,252,.9);border-radius:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="note">The stand-in from js/world/placeholder-avatar.js, used until js/art/character.js arrives. Each one plays a different animation; tap a name to play it on all of them.</div>
<script type="module">
  import * as THREE from '../lib/three.module.min.js';
  import { createCharacter, randomLook, DEFAULT_LOOK } from '../js/world/placeholder-avatar.js';

  const ANIMS = ['idle', 'walk', 'run', 'jump', 'fall', 'land', 'wave', 'cheer', 'clap', 'sit', 'dance', 'aww',
    'throw', 'catch', 'dodge', 'frozen', 'tagged', 'seek', 'hide', 'base', 'cradle',
    'highV', 'lowV', 'tMotion', 'touchdown', 'daggers', 'punch', 'clasp',
    'toeTouch', 'pike', 'kickDouble', 'twist', 'liberty', 'heelStretch', 'scorpion', 'bowArrow', 'arabesque'];
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#ffd1e8');
  scene.add(new THREE.HemisphereLight(0xfff4fb, 0xc9b6e8, 1.3));
  const sun = new THREE.DirectionalLight(0xfff1e2, 2);
  sun.position.set(-3, 6, 5);
  scene.add(sun, new THREE.AmbientLight(0xffffff, 0.35));
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 40), new THREE.MeshLambertMaterial({ color: 0xa8e6a1 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const cols = 8;
  const chars = ANIMS.map((a, i) => {
    const c = createCharacter(i === 0 ? DEFAULT_LOOK : randomLook(Math.random));
    c.group.position.set((i % cols - (cols - 1) / 2) * 1.5, 0, -Math.floor(i / cols) * 2.4);
    c.setAnim(a, { loop: true });
    c.setSpeed(a === 'walk' ? 2.4 : a === 'run' ? 6.5 : 0);
    scene.add(c.group);
    return c;
  });
  chars[0].setHighlight(true, '#ff2e93');

  const bar = document.getElementById('bar');
  for (const a of ANIMS) {
    const b = document.createElement('button');
    b.textContent = a;
    b.addEventListener('click', () => {
      for (const c of chars) {
        c.setAnim(a, { loop: true });
        c.setSpeed(a === 'walk' ? 2.4 : a === 'run' ? 6.5 : 0);
      }
    });
    bar.appendChild(b);
  }

  function resize() {
    const w = innerWidth;
    const h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.set(0, w < h ? 9 : 5.2, w < h ? 15 : 10.5);
    camera.lookAt(0, 0.6, -3.4);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();
  let last = performance.now();
  let t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    for (const c of chars) c.update(dt, t);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.chars = chars;
</script>
</body>
</html>
