<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AssistantCommish Hall of Fame</title>
<meta name="description" content="A 3D night stadium: the Hall of Fame, the Draft Day Memorial Gardens and the League Office. Tap around.">
<meta property="og:title" content="AssistantCommish Hall of Fame">
<meta property="og:description" content="Hall of Fame and Memorial Gardens. Drag to look around, tap the statues and headstones.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a1022">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hall of Fame">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#0a1022;
  --turf:#14553c;
  --gold:#f5c542;
  --chalk:#f3eedd;
  --stone:#aab3bf;
  --flare:#ff6a3d;
  --panel:rgba(10,16,34,.9);
  --line:rgba(245,197,66,.35);
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.4;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#scene.grabbing{cursor:grabbing}
#scene.point{cursor:pointer}

.bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:linear-gradient(to bottom,rgba(10,16,34,.92),rgba(10,16,34,0));pointer-events:none}
.bar > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand-top{font-family:var(--display);font-size:clamp(18px,3.2vw,28px);color:var(--gold);letter-spacing:.5px}
.brand-sub{font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
.nav{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--chalk);background:rgba(10,16,34,.75);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--gold)}
button:focus-visible,a:focus-visible{outline:3px solid var(--flare);outline-offset:2px}
button.on{background:var(--gold);color:var(--night);border-color:var(--gold)}
#music{border-style:dashed}
#music[aria-pressed="true"]{background:var(--flare);border-color:var(--flare);border-style:solid;color:var(--night)}

.caption{position:fixed;left:16px;bottom:16px;max-width:min(440px,calc(100% - 32px));padding:14px 16px;background:var(--panel);
  border-left:4px solid var(--gold);border-radius:4px}
.caption h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,26px);margin:0 0 4px;color:var(--gold);text-wrap:balance}
.caption p{margin:0}
.caption .hint{margin-top:8px;font-size:14px;color:var(--stone)}

.card{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:min(360px,calc(100% - 32px));max-height:70%;overflow:auto;
  padding:18px 18px 16px;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.card[hidden]{display:none}
.card .kicker{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--flare);margin:0 28px 4px 0}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0 0 10px;color:var(--gold);text-wrap:balance}
.card p{margin:0 0 9px}
.card .jab{color:var(--stone);font-style:italic}
.card a{color:var(--gold);font-weight:700}
.card .x{position:absolute;top:8px;right:8px;padding:2px 10px;font-size:18px;line-height:1.3}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.card dt{color:var(--stone);font-weight:600}
.card dd{margin:0;font-weight:700}

#fallback{position:fixed;inset:0;overflow:auto;padding:90px 16px 40px;background:var(--night)}
#fallback[hidden]{display:none}
#fallback section{max-width:640px;margin:0 auto 28px}
#fallback h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:0 0 8px}
#fallback h3{margin:14px 0 2px;color:var(--chalk)}
#fallback p{margin:0 0 6px;color:var(--stone)}

.bar{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.caption{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom))}
.card{right:max(16px,env(safe-area-inset-right));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (max-width:700px){
  .card{top:auto;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));left:max(16px,env(safe-area-inset-left));width:auto;transform:none;max-height:56%}
  .caption .hint{display:none}
  .card{background:rgba(10,16,34,.97)}
  button{padding:7px 11px;font-size:13.5px}
}
@media (max-height:480px){
  .caption{max-width:min(330px,calc(100% - 32px));padding:9px 12px;font-size:14.5px}
  .caption h1{font-size:18px}
  .card{top:auto;bottom:max(16px,env(safe-area-inset-bottom));transform:none;max-height:calc(100% - 110px)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A 3D night stadium with a hall of fame, a graveyard of draft picks and a standings podium"></canvas>

<header class="bar">
  <div class="brand">
    <span class="brand-top">AssistantCommish</span>
    <span class="brand-sub">Hall of Fame and Memorial Gardens</span>
  </div>
  <div class="nav" role="navigation" aria-label="Places">
    <button type="button" data-zone="hall" class="on">Hall of Fame</button>
    <button type="button" data-zone="grave">Graveyard</button>
    <button type="button" data-zone="league">League Office</button>
    <button type="button" id="music" aria-pressed="false" hidden>Beat: off</button>
  </div>
</header>

<section class="caption" aria-live="polite">
  <h1 id="capTitle">The Hall of Fame</h1>
  <p id="capText">Five picks carrying the AssistantCommish to first place. The big gold one has not played a down since 2024. Tap him.</p>
  <p class="hint">Drag to look around. Scroll or pinch to zoom. Tap any statue, headstone or flag.</p>
</section>

<aside class="card" id="card" hidden aria-live="polite">
  <button type="button" class="x" id="cardClose" aria-label="Close">×</button>
  <div id="cardBody"></div>
</aside>

<main id="fallback" hidden></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

  hall:  {title:'The Hall of Fame',

          cam:{t:[-1.2,4.8,0], r:27, theta:0, phi:1.22}},
  grave: {title:'Draft Day Memorial Gardens',
          text:'Here lie the picks, not the men. Pay your respects. One plot is suspiciously empty.',
          cam:{t:[-47,3.1,-1], r:22, theta:0.1, phi:1.12}},
  league:{title:'The League Office',
          text:'Current standings, built to scale. Three of these teams are fighting for the right to look up.',
          cam:{t:[45.8,7.6,-1], r:32, theta:-0.08, phi:1.27}}
};

var ITEMS = {
  aiyuk:{zone:'hall', kicker:'Number 1 on the big board', title:'Brandon Aiyuk',
    stats:[['Last NFL snap','Oct 20, 2024'],['Reserve/left squad','11 months'],['Reinstated','Nov 9, 2026'],['Fantasy points, 2026','0.0'],['Manager confidence','100%']],
    lines:['The centerpiece of a first-place roster has produced exactly zero points. That is how far ahead this team is.',
           'He filed the paperwork, passed the physical and climbed out of the Memorial Gardens on his own. The roster exemption runs out November 23. Crown on, bag packed, destination to be determined.'],
    jab:'The league laughed at this pick. The league is laughing a little less.'},
  walker:{zone:'hall', kicker:'Number 2', title:'Kenneth Walker III',

    jab:'Drafted on purpose. Unlike several picks on the other side of the field.'},
  mahomes:{zone:'hall', kicker:'Number 3', title:'Patrick Mahomes',
    lines:['We were told not to say it out loud.','So we commissioned a statue, put his number on it, and let the statue say it.'],
    jab:'Any resemblance to a farm animal is entirely intentional.'},
  jsn:{zone:'hall', kicker:'Number 4', title:'Jaxon Smith-Njigba',
    stats:[['Rank among WRs','1'],['PPR points per game','about 28'],['Gap to the next guy','5 points']],
    lines:['The number one receiver in football, and it is not close. Leads the league in receiving yards.',

    jab:'Fourth on this list. First on everyone else\'s.'},
  mcbride:{zone:'hall', kicker:'Number 5', title:'Trey McBride',
    lines:['A tight end who gets thrown the ball like a wide receiver. Every week. Without fail.',
           'The quietest cheat code on the roster.'],
    jab:'Fifth best player here. Would be the best player on at least three other teams in this league.'},
  imp:{zone:'hall', kicker:'League mascot', title:'The Tiptoe Imp',

    link:[

    ],

  franklin:{zone:'grave', kicker:'Rest in peace, this pick', title:'Troy Franklin',

  hampton:{zone:'grave', kicker:'Rest in peace, this pick', title:'Omarion Hampton',
    stats:[['Still rostered in','91% of leagues'],['Regretted in','100% of them']],
    lines:['Made the Week 10 lists of players it is time to let go of, while still sitting on nearly every roster in America.',
           'A first-round price for a waiver-wire feeling.'],
    jab:'Gone, but somehow still in the lineup.'},
  brown:{zone:'grave', kicker:'Rest in peace, this pick', title:'A.J. Brown',
    lines:['New team. New zip code. Same result for whoever drafted him.','Ankle: questionable. Knee: questionable. This pick: no longer in question.'],
    jab:'Changed uniforms. Did not change anybody\'s luck.'},
  herbert:{zone:'grave', kicker:'Rest in peace, this pick', title:'Justin Herbert',
    stats:[['Week 10 rank','QB22'],['Still rostered in','42% of leagues'],['Trusted in','0%']],
    lines:['Showed up on the cut lists right next to quarterbacks you forgot were in the league.','Kept on rosters mostly out of respect for the hair.'],
    jab:'A cannon for an arm. A slingshot for a stat line.'},
  achane:{zone:'grave', kicker:'Rest in peace, this pick', title:'De\'Von Achane',
    lines:['The original Achane. Says it "ay-CHAN." This roster says it "uh-oh."','Buried next to his sound-alike so the announcers only have to learn it once.'],
    jab:'Fastest man in the cemetery.'},
  etienne:{zone:'grave', kicker:'Rest in peace, this pick', title:'Travis Etienne',
    lines:['Announced in March that his name has been pronounced like "Achane" this whole time. Nobody knew. Not even his old team.',
           'So now the league has two Achanes, and this graveyard has both of them.'],
    jab:'Same name. Same plot. Same points.'},
  ferguson:{zone:'grave', kicker:'Rest in peace, this pick', title:'Terrance Ferguson',
    lines:['Groin in Week 2. Ankle in Week 3. Then a hamstring on the way back to practice.', 'This plot comes with a frequent visitor card.'],
    jab:'Day to day. Every day.'},
  vacant:{zone:'grave', kicker:'Plot available', title:'Formerly: B. Aiyuk',
    lines:['Occupied from December 2025 under the name Reserve / Left Squad.', 'Tenant checked out on November 9, 2026, took the ladder, and left gold footprints heading toward the Hall of Fame.'],
    jab:'Deposit not refunded.'},

  tony:{zone:'league', kicker:'First place', title:'AssistantCommish',
    lines:['Managed by Tony. Assistant in title only.', 'Running away with the league so thoroughly that the trophy engraver has started early.'],
    jab:'The view from up here is mostly the tops of other people\'s heads.'},
  shane:{zone:'league', kicker:'Also participating', title:'Tailored Gang',
    lines:['Managed by Shane. Sharpest name in the league.', 'The roster, however, came off the rack.'],
    jab:'Dressed for the playoffs. Not invited yet.'},
  tim:{zone:'league', kicker:'Also participating', title:'On C0k3r w Brown Nabers',
    lines:['Managed by Tim. Clear winner of Best Team Name.', 'That concludes the list of things this team is winning.'],
    jab:'The name is doing more work than the lineup.'},
  dan:{zone:'league', kicker:'Also participating', title:'The REAL Commish***',
    lines:['Managed by Dan. Three asterisks, each one earned.', '* Title under review. ** Standings not under review. *** Reports to the Assistant.'],
    jab:'Runs the league. Does not run the league.'}
};

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function cardHTML(it){
  var h='<p class="kicker">'+esc(it.kicker)+'</p><h2>'+esc(it.title)+'</h2>';
  if(it.stats){h+='<dl>';it.stats.forEach(function(s){h+='<dt>'+esc(s[0])+'</dt><dd>'+esc(s[1])+'</dd>';});h+='</dl>';}
  it.lines.forEach(function(l){h+='<p>'+esc(l)+'</p>';});
  if(it.link){h+='<p><a href="'+esc(it.link[1])+'" target="_blank" rel="noopener">'+esc(it.link[0])+'</a></p>';}
  if(it.jab){h+='<p class="jab">'+esc(it.jab)+'</p>';}
  return h;
}

function showFallback(){
  var f=$('#fallback'), html='';
  [['hall','The Hall of Fame'],['grave','Draft Day Memorial Gardens'],['league','The League Office']].forEach(function(z){
    html+='<section><h2>'+z[1]+'</h2><p>'+esc(ZONES[z[0]].text)+'</p>';
    Object.keys(ITEMS).forEach(function(k){var it=ITEMS[k]; if(it.zone!==z[0])return;
      html+='<h3>'+esc(it.title)+'</h3>'; it.lines.forEach(function(l){html+='<p>'+esc(l)+'</p>';}); if(it.jab)html+='<p><em>'+esc(it.jab)+'</em></p>';});
    html+='</section>';
  });
  html+='<section><p>The 3D stadium could not start in this browser, so here is the reading version.</p></section>';
  f.innerHTML=html; f.hidden=false; $('.caption').hidden=true; $('#scene').style.display='none';
}

var canvas=$('#scene'), renderer;
try{
  if(!window.THREE) throw new Error('no three');
  renderer=new THREE.WebGLRenderer({
    canvas:canvas, antialias:true, alpha:false, powerPreference:'high-performance'
  });
}catch(e){ showFallback(); return; }

var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var BUN='%px Bungee, "Arial Black", Impact, sans-serif';
var BAR='700 %px "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif';

function start(){
// Limit render resolution on high-DPI screens to avoid GPU overload.
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
renderer.outputEncoding=THREE.sRGBEncoding;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a1022);
scene.fog=new THREE.FogExp2(0x0a1022,0.011);
var camera=new THREE.PerspectiveCamera(50,1,0.1,700);

function std(color,o){o=o||{};return new THREE.MeshStandardMaterial({color:color,roughness:o.r===undefined?.8:o.r,metalness:o.m||0,
  emissive:o.e||0x000000,emissiveIntensity:o.ei===undefined?1:o.ei,flatShading:true});}
var M={
  gold:std(0xf5c542,{r:.35,m:.5,e:0x5a3c00,ei:.6}),
  marble:std(0xe9e4d6,{r:.7}),
  navy:std(0x18213f,{r:.7}),
  stone:std(0x9aa3ad,{r:.95}),
  stoneDark:std(0x6f7882,{r:.95}),
  dirt:std(0x3b2d22,{r:1}),
  wood:std(0x5c432f,{r:.9}),
  iron:std(0x23283a,{r:.6,m:.4}),
  imp:std(0x9fd27c,{r:.8}),
  flare:std(0xff6a3d,{r:.7}),
  hat:std(0x3a2f7a,{r:.8}),
  grey:std(0x8891a0,{r:.9}),
  hair:std(0xe6c35c,{r:.9}),
  card:std(0xb08a5a,{r:.95}),
  tan:std(0xc9a56a,{r:.9}),
  crown:std(0xfff3b0,{r:.3,m:.4,e:0x8a6a00,ei:.8})
};

function mesh(geo,mat,x,y,z,parent){var m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(parent)parent.add(m);return m;}
function box(w,h,d,mat,x,y,z,parent){return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,parent);}

function fit(g,text,x,y,maxW,size,font,color){
  var s=size; for(;;){g.font=font.replace('%',Math.round(s)); if(g.measureText(text).width<=maxW||s<=9)break; s-=1.5;}
  g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.fillText(text,x,y);
}
function wrap(g,text,x,y,maxW,lineH,font,color){
  g.font=font;g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';
  var words=text.split(' '),line='',yy=y;
  for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];
    if(g.measureText(t).width>maxW&&line){g.fillText(line,x,yy);line=words[i];yy+=lineH;}else line=t;}
  if(line)g.fillText(line,x,yy);
}
function label(w,h,draw,px){
  px=px||110;var c=document.createElement('canvas');c.width=Math.round(w*px);c.height=Math.round(h*px);
  draw(c.getContext('2d'),c.width,c.height);
  var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true}));
}
function board(g,W,H,bg,edge){g.fillStyle=bg;g.fillRect(0,0,W,H);g.strokeStyle=edge;g.lineWidth=Math.max(4,H*.03);g.strokeRect(g.lineWidth/2,g.lineWidth/2,W-g.lineWidth,H-g.lineWidth);}

var clickables=[], tags=[];
var HIT=new THREE.MeshBasicMaterial({visible:false});
function clickable(group,id){group.userData.id=id;clickables.push(group);return group;}

/* lights */
scene.add(new THREE.HemisphereLight(0x9db4ff,0x1b2a22,.62));
var moonLight=new THREE.DirectionalLight(0xc6d4ff,.55);moonLight.position.set(-40,60,30);scene.add(moonLight);
var hallLight=new THREE.PointLight(0xffd88a,1.25,70,1.6);hallLight.position.set(0,13,9);scene.add(hallLight);
var graveLight=new THREE.PointLight(0x7dffd0,.9,45,1.6);graveLight.position.set(-48,5,5);scene.add(graveLight);
var leagueLight=new THREE.PointLight(0xffe0a0,1.1,70,1.6);leagueLight.position.set(48,14,12);scene.add(leagueLight);

/* ground */
(function(){
  var far=mesh(new THREE.PlaneGeometry(600,600),std(0x0b1512,{r:1}),0,-.05,0,scene);far.rotation.x=-Math.PI/2;
  var W=2048,H=878,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
  function X(u){return (u+70)/140*W;} function Z(v){return (v+30)/60*H;}
  g.fillStyle='#0b1512';g.fillRect(0,0,W,H);
  g.fillStyle='#151c18';g.fillRect(X(-70),0,X(-30)-X(-70),H);
  for(var i=0;i<260;i++){g.fillStyle='rgba('+(20+Math.random()*20|0)+','+(34+Math.random()*26|0)+','+(26+Math.random()*14|0)+',.5)';
    g.beginPath();g.arc(X(-70)+Math.random()*(X(-30)-X(-70)),Math.random()*H,6+Math.random()*26,0,7);g.fill();}
  g.fillStyle='#0f1734';g.fillRect(X(30),0,X(70)-X(30),H);
  g.strokeStyle='rgba(245,197,66,.55)';g.lineWidth=5;g.strokeRect(X(33),Z(-26),X(67)-X(33),Z(26)-Z(-26));
  for(var u=-30;u<30;u+=5){g.fillStyle=((u/5)&1)?'#14553c':'#114a35';g.fillRect(X(u),Z(-26),X(u+5)-X(u)+1,Z(26)-Z(-26));}
  g.strokeStyle='rgba(243,238,221,.75)';g.lineWidth=4;
  for(u=-30;u<=30;u+=5){g.beginPath();g.moveTo(X(u),Z(-26));g.lineTo(X(u),Z(26));g.stroke();}
  g.lineWidth=7;g.strokeRect(X(-30),Z(-26),X(30)-X(-30),Z(26)-Z(-26));
  g.fillStyle='rgba(243,238,221,.5)';
  for(u=-29;u<30;u++){if(u%5===0)continue;g.fillRect(X(u)-1,Z(-9),2,10);g.fillRect(X(u)-1,Z(9)-10,2,10);}
  var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  var field=mesh(new THREE.PlaneGeometry(140,60),new THREE.MeshStandardMaterial({map:t,roughness:1}),0,0,0,scene);field.rotation.x=-Math.PI/2;
})();

/* sky */
(function(){
  var n=700,pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,e=Math.random()*1.35+.08,R=420;
    pos[i*3]=Math.cos(a)*Math.cos(e)*R;pos[i*3+1]=Math.sin(e)*R;pos[i*3+2]=Math.sin(a)*Math.cos(e)*R;}
  var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xdfe7ff,size:1.6,sizeAttenuation:false,fog:false})));
  mesh(new THREE.SphereGeometry(13,24,16),new THREE.MeshBasicMaterial({color:0xfff2c2,fog:false}),-150,95,-230,scene);

/* camera & navigation */
var cur={tx:-1.2,ty:4.8,tz:0,r:60,theta:.5,phi:1.0}, goal={tx:0,ty:0,tz:0,r:27,theta:0,phi:1.22};
var touched=false, zone='hall';
function setGoal(c){goal.tx=c.t[0];goal.ty=c.t[1];goal.tz=c.t[2];goal.r=c.r;goal.theta=c.theta;goal.phi=c.phi;}

var lastW=0,lastH=0;
function resize(){
  var w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);
  if(w===lastW && h===lastH)return;
  lastW=w;lastH=h;
  renderer.setSize(w,h,false);

}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,250);});

function applyCamera(){
  var portrait=camera.aspect<1?1+(1-camera.aspect)*1.25:1, r=cur.r*portrait;
  camera.position.set(cur.tx+r*Math.sin(cur.phi)*Math.sin(cur.theta),cur.ty+r*Math.cos(cur.phi),cur.tz+r*Math.sin(cur.phi)*Math.cos(cur.theta));
  camera.lookAt(cur.tx,cur.ty,cur.tz);
}

var raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
function getIntersect(e){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var hits=raycaster.intersectObjects(clickables,true);
  if(hits.length>0){
    var obj=hits[0].object;
    while(obj&&!obj.userData.id&&obj.parent)obj=obj.parent;
    return obj;
  }
  return null;
}

canvas.addEventListener('pointermove',function(e){
  if(touched)return;
  var hit=getIntersect(e);
  canvas.classList.toggle('point',!!hit);
});

canvas.addEventListener('click',function(e){
  if(suppressClick){suppressClick=false;return;}
  var hit=getIntersect(e);
  if(hit&&hit.userData.id){openCard(hit.userData.id);}
});

var isDown=false, startX=0, startY=0, dragDistance=0, suppressClick=false;
// Track every finger so one finger orbits and two fingers pinch to zoom.
var pts={}, ptCount=0, pinchDist=0, pinched=false;
function spread(){var k=Object.keys(pts);if(k.length<2)return 0;var a=pts[k[0]],b=pts[k[1]];return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));}
canvas.addEventListener('pointerdown',function(e){
  if(!pts[e.pointerId])ptCount++;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  touched=true;
  if(ptCount===1){isDown=true; dragDistance=0; pinched=false; startX=e.clientX; startY=e.clientY;}
  else{pinched=true; pinchDist=spread();}
  try{if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);}catch(err){}
  canvas.classList.add('grabbing');
});
window.addEventListener('pointermove',function(e){
  var p=pts[e.pointerId]; if(!p)return;
  if(ptCount>=2){
    p.x=e.clientX; p.y=e.clientY;
    var d=spread();
    if(pinchDist>0&&d>0) goal.r=Math.max(14,Math.min(85,goal.r*pinchDist/d));
    pinchDist=d;
    return;
  }
  if(!isDown)return;
  var dx=e.clientX-startX, dy=e.clientY-startY;
  dragDistance+=Math.abs(dx)+Math.abs(dy);
  startX=e.clientX; startY=e.clientY; p.x=e.clientX; p.y=e.clientY;
  goal.theta-=dx*0.005;
  goal.phi=Math.max(0.2,Math.min(Math.PI/2-0.05,goal.phi-dy*0.005));
});
function pointerEnd(e){
  if(!pts[e.pointerId])return;
  delete pts[e.pointerId]; ptCount--;
  if(ptCount>=1){
    // One finger lifted mid-pinch: carry on orbiting with the finger still down.
    var k=Object.keys(pts)[0]; startX=pts[k].x; startY=pts[k].y; pinchDist=spread();
    return;
  }
  ptCount=0; isDown=false;
  suppressClick=pinched||dragDistance>6;
  // A click only follows a clean tap, so clear the flag if no click is coming.
  if(suppressClick) setTimeout(function(){suppressClick=false;},350);
  canvas.classList.remove('grabbing');
}
window.addEventListener('pointerup',pointerEnd);
window.addEventListener('pointercancel',pointerEnd);
// Stop iOS Safari from zooming the whole page when pinching over the stadium.
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});

/* animation loop */
var clock=new THREE.Clock(), T=0, rafId=0;
function frame(){
  if(document.hidden){rafId=0;return;}
  // Clamp long frames after stalls so moving objects do not visibly jump.
  var dt=Math.min(clock.getDelta(),.05); T+=dt;
  var k=1-Math.exp(-dt*3.1);
  cur.tx+=(goal.tx-cur.tx)*k; cur.ty+=(goal.ty-cur.ty)*k; cur.tz+=(goal.tz-cur.tz)*k;
  cur.r+=(goal.r-cur.r)*k; cur.theta+=(goal.theta-cur.theta)*k; cur.phi+=(goal.phi-cur.phi)*k;
  applyCamera();

  spin.forEach(function(s){s.rotation.y+=dt*(REDUCED?.1:.45);});
  tags.forEach(function(t){t.quaternion.copy(camera.quaternion);});

  var p=confetti.geo.attributes.position.array,i;
  for(i=0;i<confetti.n;i++){p[i*3+1]-=confetti.spd[i]*dt*(REDUCED?.3:1);p[i*3]+=Math.sin(T*1.3+i)*dt*.25;if(p[i*3+1]<.5)p[i*3+1]=18;}
  confetti.geo.attributes.position.needsUpdate=true;

  var a=T*.33+.34*Math.sin(T*.8), R=6.25, beat=T*7.5;
  imp.g.position.set(Math.sin(a)*R,.5+.1*Math.abs(Math.sin(beat)),-1.2+Math.cos(a)*R*.86+1.2);
  var da=.33+.272*Math.cos(T*.8);
  imp.g.rotation.y=a+(da>=0?Math.PI/2:-Math.PI/2);
  imp.legs.forEach(function(l){l.rotation.x=Math.sin(beat+(l.userData.s>0?0:Math.PI))*.85;});
  imp.arms.forEach(function(ar){ar.rotation.z=ar.userData.s*(1.42+.16*Math.sin(beat*.5+ar.userData.s));});
  imp.body.rotation.z=Math.sin(beat*.5)*.13; imp.body.rotation.x=-.08;

  ghosts.forEach(function(g){g.position.y=g.userData.base+Math.sin(T*.9+g.userData.ph)*.45;g.rotation.y=Math.sin(T*.5+g.userData.ph)*.5;});
  if(fireflies){fireflies.material.opacity=.55+.4*Math.sin(T*2.2);fireflies.position.y=Math.sin(T*.6)*.25;}
  flags.forEach(function(f){var q=f.geometry.attributes.position;for(var j=0;j<q.count;j++){q.setZ(j,Math.sin(q.getX(j)*3+T*5)*.12*(q.getX(j)+.95));}q.needsUpdate=true;});

  renderer.render(scene,camera);
  rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(rafId)cancelAnimationFrame(rafId);
    rafId=0;
  }else if(!rafId){
    clock.getDelta();
    rafId=requestAnimationFrame(frame);
  }
});
rafId=requestAnimationFrame(frame);

} // end start()

if(renderer){
  var began=false, begin=function(){if(began)return;began=true;start();};
  if(document.fonts&&document.fonts.load){
    Promise.all([document.fonts.load('32px Bungee'),document.fonts.load('700 32px "Barlow Semi Condensed"')]).then(begin,begin);
    setTimeout(begin,2500);
  }else begin();
}
})();

<!-- Background track lives in beat.mp3 next to this page. -->
<audio id="background-audio" preload="none" loop playsinline src="beat.mp3"></audio>
<p id="music-status" role="status" aria-live="polite" style="position:fixed;left:-10000px;width:1px;height:1px;overflow:hidden">Music is off.</p>
<script>
(function(){
  'use strict';
  var audio = document.getElementById('background-audio');
  var button = document.getElementById('music');
  var status = document.getElementById('music-status');
  var musicOn = false;

  // Show the Beat button only when beat.mp3 is actually sitting next to this page.
  if (window.fetch) {
    fetch(audio.getAttribute('src'), {method:'HEAD'}).then(function(r){ if (r.ok) button.hidden = false; }).catch(function(){});
  }

  button.addEventListener('click', function(){
    if (!musicOn) {
      // Playback is initiated directly by the user's tap to satisfy browser policy.
      button.textContent = 'Beat: loading';
      var playPromise = audio.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(function(){
          musicOn = true;
          button.setAttribute('aria-pressed', 'true');
          button.textContent = 'Beat: on';
          status.textContent = 'Music is playing.';
        }).catch(function(){
          musicOn = false;
          button.setAttribute('aria-pressed', 'false');
          button.textContent = 'Beat: off';
          status.textContent = 'Playback was blocked. Tap Beat to try again.';
        });
      } else {
        musicOn = true;
        button.setAttribute('aria-pressed', 'true');
        button.textContent = 'Beat: on';
        status.textContent = 'Music is playing.';
      }
    } else {
      audio.pause();
      musicOn = false;
      button.setAttribute('aria-pressed', 'false');
      button.textContent = 'Beat: off';
      status.textContent = 'Music is off.';
    }
  });

  audio.addEventListener('ended', function(){
    // The loop attribute normally handles this; retain a safe fallback.
    if (musicOn) { audio.currentTime = 0; audio.play().catch(function(){}); }
  });
})();
</script>
